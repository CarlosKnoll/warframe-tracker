name: Promote release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote (e.g. v3.3.0)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest